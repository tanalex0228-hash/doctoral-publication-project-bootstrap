<form method="get" class="card card-body shadow-sm mb-4">
  <div class="row g-3">
    <div class="col-lg-4"><label class="form-label" for="{{ filter_form.q.id_for_label }}">{{ filter_form.q.label }}</label>{{ filter_form.q }}</div>
    <div class="col-md-2"><label class="form-label" for="{{ filter_form.year.id_for_label }}">{{ filter_form.year.label }}</label>{{ filter_form.year }}</div>
    <div class="col-md-3"><label class="form-label" for="{{ filter_form.publication_type.id_for_label }}">{{ filter_form.publication_type.label }}</label>{{ filter_form.publication_type }}</div>
    <div class="col-md-3"><label class="form-label" for="{{ filter_form.publication_index.id_for_label }}">{{ filter_form.publication_index.label }}</label>{{ filter_form.publication_index }}</div>
    <div class="col-md-3"><label class="form-label" for="{{ filter_form.research_field.id_for_label }}">{{ filter_form.research_field.label }}</label>{{ filter_form.research_field }}</div>
    <div class="col-md-2"><label class="form-label" for="{{ filter_form.language.id_for_label }}">{{ filter_form.language.label }}</label>{{ filter_form.language }}</div>
    <div class="col-md-3"><label class="form-label" for="id_sort">排序</label><select class="form-select" id="id_sort" name="sort"><option value="publication_date" {% if sort == 'publication_date' %}selected{% endif %}>最近發表</option><option value="title" {% if sort == 'title' %}selected{% endif %}>標題</option><option value="publication_type" {% if sort == 'publication_type' %}selected{% endif %}>成果類型</option></select></div>
  </div>
  {% if filter_form.errors %}<div class="text-danger small mt-3">請修正篩選條件。</div>{% endif %}
  <div class="mt-3 d-flex gap-2"><button class="btn btn-primary" type="submit">搜尋與篩選</button><a class="btn btn-outline-secondary" href="{{ request.path }}">清除條件</a></div>
</form>
