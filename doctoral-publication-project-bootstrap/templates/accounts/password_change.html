{% extends "base.html" %}
{% block title %}變更密碼｜博士班成果管理{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-3">變更密碼</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}</div>{% endfor %}<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">更新密碼</button><a class="btn btn-outline-secondary" href="{% url 'accounts:profile' %}">取消</a></div></form></div></div></div></div>
{% endblock %}
