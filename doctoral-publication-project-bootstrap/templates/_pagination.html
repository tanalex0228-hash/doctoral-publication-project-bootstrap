{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-3" aria-label="分頁"><ul class="pagination justify-content-center mb-0">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">上一頁</a></li>{% else %}<li class="page-item disabled"><span class="page-link">上一頁</span></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 頁</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">下一頁</a></li>{% else %}<li class="page-item disabled"><span class="page-link">下一頁</span></li>{% endif %}
</ul></nav>
{% endif %}
