<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}博士班成果管理系統{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <div class="d-flex align-items-center gap-3"><a class="navbar-brand mb-0" href="{% url 'accounts:home' %}">博士班成果管理</a><a class="link-light text-decoration-none small" href="{% url 'public_site:publication_list' %}">公開成果</a></div>
      {% if user.is_authenticated %}<div class="d-flex align-items-center gap-2"><span class="navbar-text text-white">{{ user.username }}</span>{% if user.is_staff %}<a class="btn btn-sm btn-warning" href="{% url 'admin:index' %}">Django 管理後台</a>{% endif %}<form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">登出</button></form></div>{% endif %}
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
